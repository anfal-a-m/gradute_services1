databases:
  - name: graduate-services-db
    databaseName: graduate_services
    user: graduate_services
    plan: free

services:
  - type: web
    name: gradute-services1
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn gradute_services1.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ENV
        value: "production"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "gradute-services1.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://gradute-services1.onrender.com"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-5.6-luna"
      - key: OPENAI_ASSISTANT_ENABLED
        value: "True"
      - key: OPENAI_REASONING_EFFORT
        value: "none"
      - key: OPENAI_TEXT_VERBOSITY
        value: "low"
      - key: DB_HOST
        fromDatabase:
          name: graduate-services-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: graduate-services-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: graduate-services-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: graduate-services-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: graduate-services-db
          property: password
      - key: DB_SSLMODE
        value: "prefer"
