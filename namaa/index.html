<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Namaa Interactive Pipeline</title>
<style>
:root {
  --navy:#0d2238; --teal:#75cbd0; --white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:#e9eef2}
.app{height:100%;display:grid;grid-template-rows:64px 1fr}
.topbar{
  position:relative;z-index:50;display:flex;align-items:center;justify-content:center;
  gap:8px;padding:9px 12px;background:rgba(11,34,56,.98);
  border-bottom:1px solid rgba(255,255,255,.12);box-shadow:0 4px 18px rgba(7,25,42,.2)
}
.nav{display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none;max-width:calc(100vw - 170px)}
.nav::-webkit-scrollbar{display:none}
.nav button,.action{
  height:43px;min-width:74px;border:1px solid rgba(255,255,255,.15);border-radius:12px;
  background:rgba(255,255,255,.06);color:#eaf3f8;padding:0 13px;font-size:13px;font-weight:600;
  cursor:pointer;transition:.18s ease;white-space:nowrap
}
.nav button:hover,.action:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.nav button.active{background:var(--teal);border-color:#a8e3e6;color:#083146;box-shadow:0 5px 15px rgba(117,203,208,.25)}
.nav .ico{display:inline-grid;place-items:center;width:23px;height:23px;margin-right:5px;border-radius:7px;background:rgba(255,255,255,.1);font-size:12px;font-weight:800}
.nav button.active .ico{background:rgba(7,49,70,.1)}
.actions{position:absolute;right:12px;display:flex;gap:7px}
.action{min-width:44px;padding:0 11px;font-size:16px}
.live{font-size:12px;background:#fff;color:#164a60;border-color:#fff;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.stage{position:relative;overflow:hidden;background:#edf1f4}
.canvas{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.canvas.grabbing{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.visual{display:block;pointer-events:none;user-select:none}
.focus{position:absolute;border:4px solid rgba(79,183,191,.95);border-radius:18px;box-shadow:0 0 0 2px rgba(255,255,255,.65),0 10px 25px rgba(30,93,106,.2);pointer-events:none;opacity:0;transition:opacity .18s}
.focus.show{opacity:1}
.zoomCtl{position:absolute;right:18px;bottom:18px;display:flex;gap:7px;z-index:20}
.zoomCtl button{width:44px;height:44px;border:0;border-radius:12px;background:rgba(13,34,56,.94);color:#fff;font-size:19px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.zoomCtl button:hover{background:#1b4a6c}
@media(max-width:1100px){
  .nav button{min-width:52px;padding:0 9px;font-size:12px}
  .nav .ico{margin-right:2px} .live{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="nav" id="nav"></div>
    <div class="actions">
      <a class="action live" href="http://localhost:8080/ui" target="_blank" rel="noopener" title="Open Apache Hop on this device">● Hop Live</a>
      <button class="action" id="fsBtn" title="Fullscreen">⛶</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="canvas" id="canvas">
      <div class="world" id="world">
        <img id="visual" class="visual" draggable="false" alt="Namaa Integration Visual">
        <div class="focus" id="focus"></div>
      </div>
    </div>
    <div class="zoomCtl">
      <button id="zoomOut" title="Zoom out">−</button>
      <button id="home" title="Overview">⌂</button>
      <button id="zoomIn" title="Zoom in">+</button>
    </div>
  </main>
</div>

const sections=[{"id": "overview", "label": "Overview", "icon": "⌂", "box": [0, 0, 1710, 1540], "maxScale": 1.0}, {"id": "projects", "label": "Projects", "icon": "P", "box": [35, 15, 1470, 250], "maxScale": 1.28}, {"id": "finance", "label": "Finance", "icon": "F", "box": [35, 245, 1500, 255], "maxScale": 1.26}, {"id": "budgets", "label": "Budgets", "icon": "B", "box": [35, 500, 1490, 205], "maxScale": 1.28}, {"id": "workforce", "label": "Workforce", "icon": "W", "box": [35, 700, 1460, 210], "maxScale": 1.28}, {"id": "compute", "label": "Compute", "icon": "C", "box": [35, 905, 1460, 205], "maxScale": 1.28}, {"id": "crosswalk", "label": "Crosswalk", "icon": "X", "box": [35, 1110, 760, 410], "maxScale": 1.34}, {"id": "hub", "label": "Hub & Publication", "icon": "H", "box": [1180, 230, 510, 900], "maxScale": 1.22}, {"id": "workflow", "label": "Workflow", "icon": "↻", "view": "workflow", "box": [0, 0, 904, 422], "maxScale": 1.55}];
const stage=document.getElementById('stage'), canvas=document.getElementById('canvas'),
      world=document.getElementById('world'), visual=document.getElementById('visual'),
      focus=document.getElementById('focus'), nav=document.getElementById('nav');
let scale=1,tx=0,ty=0,current=0,dragging=false,sx=0,sy=0,startTx=0,startTy=0,currentView='pipeline';
let imgW=1710,imgH=1540;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function render(anim=true){
  world.style.transition=anim?'transform .48s cubic-bezier(.22,.72,.24,1)':'none';
  world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
}
function switchView(view){
  if(view==='workflow'){
    currentView='workflow'; imgW=904; imgH=422; visual.src=workflowSrc; visual.style.width=imgW+'px'; visual.style.height=imgH+'px';
  } else {
    currentView='pipeline'; imgW=1710; imgH=1540; visual.src=pipelineSrc; visual.style.width=imgW+'px'; visual.style.height=imgH+'px';
  }
}
function setFocus(s){
  if(s.id==='overview'||s.id==='workflow'){focus.classList.remove('show');return}
  const [x,y,w,h]=s.box;
  focus.style.left=x+'px';focus.style.top=y+'px';focus.style.width=w+'px';focus.style.height=h+'px';
  focus.classList.add('show');
}
function fitSection(s){
  const [x,y,w,h]=s.box, sw=stage.clientWidth, sh=stage.clientHeight;
  const padX=s.id==='overview'?24:52, padY=s.id==='overview'?24:58;
  const fit=Math.min((sw-padX*2)/w,(sh-padY*2)/h);
  scale=clamp(Math.min(fit,s.maxScale||1.25),.22,2.5);
  tx=(sw-w*scale)/2-x*scale; ty=(sh-h*scale)/2-y*scale; render(true);
}
function select(i){
  current=(i+sections.length)%sections.length;
  const s=sections[current];
  switchView(s.view==='workflow'?'workflow':'pipeline');
  fitSection(s); setFocus(s);
  [...nav.children].forEach((b,j)=>b.classList.toggle('active',j===current));
}
sections.forEach((s,i)=>{
  const b=document.createElement('button');
  b.innerHTML=`<span class="ico">${s.icon}</span>${s.label}`;
  b.onclick=()=>select(i); nav.appendChild(b);
});

canvas.addEventListener('pointerdown',e=>{
  dragging=true;canvas.classList.add('grabbing');sx=e.clientX;sy=e.clientY;startTx=tx;startTy=ty;canvas.setPointerCapture(e.pointerId)
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging)return;tx=startTx+(e.clientX-sx);ty=startTy+(e.clientY-sy);render(false)
});
canvas.addEventListener('pointerup',()=>{dragging=false;canvas.classList.remove('grabbing')});

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=stage.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const old=scale,next=clamp(scale*(e.deltaY<0?1.10:.91),.22,2.5);
  const wx=(mx-tx)/old,wy=(my-ty)/old;
  scale=next;tx=mx-wx*scale;ty=my-wy*scale;render(false)
},{passive:false});

function zoomBy(f){
  const cx=stage.clientWidth/2,cy=stage.clientHeight/2,old=scale,next=clamp(scale*f,.22,2.5);
  const wx=(cx-tx)/old,wy=(cy-ty)/old;scale=next;tx=cx-wx*scale;ty=cy-wy*scale;render(true)
}
document.getElementById('zoomIn').onclick=()=>zoomBy(1.16);
document.getElementById('zoomOut').onclick=()=>zoomBy(.86);
document.getElementById('home').onclick=()=>select(0);
document.getElementById('fsBtn').onclick=()=>{
  if(!document.fullscreenElement)document.documentElement.requestFullscreen(); else document.exitFullscreen()
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')select(current+1);
  else if(e.key==='ArrowLeft')select(current-1);
  else if(/^[0-8]$/.test(e.key))select(Number(e.key));
  else if(e.key==='+'||e.key==='=')zoomBy(1.16);
  else if(e.key==='-')zoomBy(.86);
});
window.addEventListener('resize',()=>select(current));
visual.onload=()=>select(current);
select(0);
</script>
