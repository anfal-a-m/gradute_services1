<style>
    .assistant-launcher{position:fixed;left:24px;bottom:24px;width:62px;height:62px;border:0;border-radius:50%;background:#3c7974;color:#fff;box-shadow:0 10px 30px rgba(35,76,73,.35);cursor:pointer;z-index:1000;display:grid;place-items:center}.assistant-launcher svg{width:30px;height:30px}.assistant-launcher:focus-visible,.assistant-close:focus-visible,.assistant-send:focus-visible{outline:3px solid #f0c84b;outline-offset:3px}.assistant-panel{position:fixed;left:24px;bottom:98px;width:min(390px,calc(100vw - 32px));height:min(590px,calc(100vh - 130px));background:#fff;border:1px solid #dce9e7;border-radius:20px;box-shadow:0 20px 55px rgba(21,52,49,.25);z-index:1000;display:none;grid-template-rows:auto 1fr auto;overflow:hidden}.assistant-panel.is-open{display:grid}.assistant-header{display:flex;align-items:center;gap:12px;background:#234c49;color:#fff;padding:15px 17px}.assistant-avatar{width:38px;height:38px;border-radius:50%;background:#fff;color:#234c49;display:grid;place-items:center;font-weight:900}.assistant-title{font-weight:800}.assistant-status{font-size:.76rem;opacity:.82}.assistant-close{margin-right:auto;border:0;background:transparent;color:#fff;font-size:1.6rem;cursor:pointer}.assistant-messages{overflow-y:auto;padding:16px;background:#f6faf9;display:flex;flex-direction:column;gap:12px}.assistant-message{max-width:88%;padding:10px 13px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere}.assistant-message.bot{align-self:flex-start;background:#fff;border:1px solid #dce9e7}.assistant-message.user{align-self:flex-end;background:#3c7974;color:#fff}.assistant-message.error{align-self:center;background:#fff0f0;color:#a13c3c;border:1px solid #efcaca}.assistant-typing{font-size:.86rem;color:#617572}.assistant-form{display:grid;grid-template-columns:1fr auto;gap:9px;padding:12px;border-top:1px solid #dce9e7}.assistant-input{width:100%;min-height:46px;max-height:110px;resize:none;padding:10px;border:1px solid #bdd0ce;border-radius:9px}.assistant-send{align-self:end;border:0;border-radius:10px;background:#3c7974;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.assistant-send:disabled{opacity:.55}.assistant-note{grid-column:1/-1;margin:0;color:#6a7d7a;font-size:.72rem}@media(max-width:700px){.assistant-launcher{left:16px;bottom:16px}.assistant-panel{left:16px;bottom:88px;height:min(570px,calc(100vh - 110px))}}
</style>
<button class="assistant-launcher" id="assistant-launcher" type="button" aria-label="فتح المساعد الذكي" aria-controls="assistant-panel" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-8 8H6l-4 2 1.4-4.2A9 9 0 1 1 21 12Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg></button>
<section class="assistant-panel" id="assistant-panel" aria-label="المساعد الذكي" aria-hidden="true">
    <header class="assistant-header"><span class="assistant-avatar">م</span><div><div class="assistant-title">مساعد بوابة الخريجين</div><div class="assistant-status">دليلك الذكي داخل المنصة</div></div><button class="assistant-close" id="assistant-close" type="button" aria-label="إغلاق المساعد">&times;</button></header>
    <div class="assistant-messages" id="assistant-messages" role="log" aria-live="polite"><div class="assistant-message bot">مرحبًا! يمكنني إرشادك داخل المنصة ومساعدتك مهنيًا. كيف أساعدك؟</div></div>
    <form class="assistant-form" id="assistant-form">{% csrf_token %}<textarea class="assistant-input" id="assistant-input" maxlength="1500" rows="1" placeholder="اكتب سؤالك هنا..." aria-label="رسالتك للمساعد" required></textarea><button class="assistant-send" id="assistant-send" type="submit">إرسال</button><p class="assistant-note">لا ترسل كلمات المرور أو أرقام الهوية أو أي بيانات حساسة.</p></form>
</section>
<script>
(() => {const l=document.getElementById('assistant-launcher'),p=document.getElementById('assistant-panel'),c=document.getElementById('assistant-close'),f=document.getElementById('assistant-form'),i=document.getElementById('assistant-input'),s=document.getElementById('assistant-send'),b=document.getElementById('assistant-messages'),t=f.querySelector('[name=csrfmiddlewaretoken]').value,h=[];function o(v){p.classList.toggle('is-open',v);p.setAttribute('aria-hidden',String(!v));l.setAttribute('aria-expanded',String(v));(v?i:l).focus()}function a(x,y){const e=document.createElement('div');e.className=`assistant-message ${y}`;e.textContent=x;b.appendChild(e);b.scrollTop=b.scrollHeight}l.addEventListener('click',()=>o(!p.classList.contains('is-open')));c.addEventListener('click',()=>o(false));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&p.classList.contains('is-open'))o(false)});i.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();f.requestSubmit()}});f.addEventListener('submit',async e=>{e.preventDefault();const m=i.value.trim();if(!m||s.disabled)return;a(m,'user');h.push({role:'user',content:m});i.value='';s.disabled=true;const q=document.createElement('div');q.className='assistant-typing';q.textContent='المساعد يكتب...';b.appendChild(q);try{const r=await fetch('{% url "core:assistant_chat" %}',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':t,'X-Assistant-Page':location.pathname},body:JSON.stringify({message:m,history:h.slice(-8)}),credentials:'same-origin'}),d=await r.json().catch(()=>({}));q.remove();if(!r.ok)throw new Error(d.error||'تعذر الحصول على رد الآن.');a(d.reply,'bot');h.push({role:'assistant',content:d.reply});if(h.length>8)h.splice(0,h.length-8)}catch(e){q.remove();a(e.message||'حدث خطأ غير متوقع.','error')}finally{s.disabled=false;i.focus()}})})();
</script>
